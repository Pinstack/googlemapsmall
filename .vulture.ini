[vulture]
verbose = false
min_confidence = 80
sort_by_size = true

# Ignore patterns for common false positives
ignore_names = [
    # Common test patterns
    test_*,
    *_test,
    setUp,
    tearDown,

    # Common utility patterns
    __version__,
    __all__,

    # Playwright patterns
    page,
    browser,
    context,

    # Protobuf patterns
    decode_*,
    encode_*,
    serialize,
    deserialize
]

# Ignore decorators (often used for configuration)
ignore_decorators = [
    @pytest.fixture,
    @pytest.mark.*,
    @property,
    @staticmethod,
    @classmethod
]
